{% extends "layout.html" %}

{% block title %}{{ book.title }}{% endblock %}

{% block content %}
<h2>{{ book.title }}</h2>
<ul>
  <li>Kirjailija: {{ book.author }}</li>
  <li>Julkaisuvuosi: {{ book.year }}</li>
  <li>Lisännyt: {{ book.username }}</li>
</ul>
<p>
  {{ book.description }}
</p>
{% endblock %}
