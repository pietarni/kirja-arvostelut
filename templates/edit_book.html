{% extends "layout.html" %}

{% block title %}Kirjan muokkaus{% endblock %}

{% block content %}
<h2>{{ book.title }}</h2>
<h3>Kirjan muokkaus</h3>
<form action="/update_book" method="post">
  <p>
    <label for="title">Nimi</label>: <br />
    <input type="text" name="title" id="title" value="{{ book.title }}" />
  </p>
  <p>
    <label for="author">Kirjailija</label>: <br />
    <input type="text" name="author" id="author" value="{{ book.author }}" />
  </p>
  <p>
    <label for="year">Julkaisuvuosi</label>: <br />
    <input type="text" name="year" id="year" value="{{ book.year }}" size="4" />
  </p>
  <p>
    <label for="description">Kuvaus</label>: <br />
    <textarea name="description" id="description" rows="8" cols="60">{{ book.description }}</textarea>
  </p>
  <input type="hidden" name="book_id" value="{{ book.id }}" />
  <input type="submit" value="Tallenna muutokset" />
</form>
<p>
  <a href="/book/{{ book.id }}">Takaisin kirjaan</a>
</p>
{% endblock %}
